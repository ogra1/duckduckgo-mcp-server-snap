<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Definitions for gradients and drop shadows -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E86840" />
      <stop offset="100%" stop-color="#C53E1B" />
    </linearGradient>
    <linearGradient id="server-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D3748" />
      <stop offset="100%" stop-color="#1A202C" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Circle (DuckDuckGo Orange with Gradient) -->
  <circle cx="256" cy="256" r="240" fill="url(#bg-grad)" />

  <!-- MCP Server Infrastructure / Connection Lines -->
  <g stroke="#FFFFFF" stroke-width="4" opacity="0.25" stroke-dasharray="8 6">
    <line x1="256" y1="60" x2="256" y2="452" />
    <line x1="60" y1="256" x2="452" y2="256" />
    <circle cx="256" cy="256" r="160" fill="none" />
  </g>

  <!-- MCP Server Block Base (Bottom Layer) -->
  <rect x="146" y="320" width="220" height="70" rx="12" fill="url(#server-grad)" filter="url(#shadow)" />
  <!-- Server Lights & Details -->
  <circle cx="180" cy="355" r="6" fill="#2ECC71" /> <!-- Green Connection LED -->
  <circle cx="205" cy="355" r="6" fill="#4A5568" />
  <circle cx="230" cy="355" r="6" fill="#4A5568" />
  <!-- Server Slots -->
  <line x1="270" y1="350" x2="336" y2="350" stroke="#4A5568" stroke-width="4" stroke-linecap="round" />
  <line x1="270" y1="360" x2="310" y2="360" stroke="#4A5568" stroke-width="4" stroke-linecap="round" />

  <!-- DuckDuckGo Duck Character (Integrated with Server) -->
  <g filter="url(#shadow)">
    <!-- White Body & Head Base -->
    <path d="M256 120 c-30 0-55 22-55 50 0 16 8 30 20 40 l-10 60 c0 15 15 25 35 25 s35-10 35-25 l-10-60 c12-10 20-24 20-40 0-28-25-50-55-50z" fill="#FFFFFF" />
    
    <!-- Duck Bill / Schnabel -->
    <path d="M275 155 c20 0 35 6 35 14 s-15 14-35 14 h-15 v-28 h15z" fill="#F4B400" />
    
    <!-- Duck Eye -->
    <circle cx="235" cy="155" r="6" fill="#2D3748" />
    
    <!-- Duck Green Bowtie / MCP Data Node -->
    <path d="M236 245 l20 10 l20-10 l-5 18 l-15-8 l-15 8 z" fill="#DE5833" />
    <circle cx="256" cy="250" r="4" fill="#FFFFFF" />
  </g>

  <!-- Network Connection Nodes (MCP Interface) -->
  <circle cx="256" cy="60" r="10" fill="#2ECC71" stroke="#FFFFFF" stroke-width="3" />
  <circle cx="146" cy="355" r="8" fill="#3182CE" stroke="#FFFFFF" stroke-width="2" />
  <circle cx="366" cy="355" r="8" fill="#3182CE" stroke="#FFFFFF" stroke-width="2" />
</svg>
